name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
        env:
          ZB_KEYCHAIN_TEST: ${{ runner.os != 'Linux' && '1' || '' }} # macOS Keychain, Windows Credential Manager

  keychain-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sudo apt-get update -q && sudo apt-get install -y -q gnome-keyring libsecret-tools dbus-x11
      - name: Test against the Secret Service (GNOME Keyring)
        run: dbus-run-session -- sh -c 'echo test | gnome-keyring-daemon --unlock --components=secrets >/dev/null && ZB_KEYCHAIN_TEST=1 go test -run TestOSKeychain -v ./...'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build all release targets
        run: .github/build.sh "dev-${GITHUB_SHA::7}"
      # The release signs SHA256SUMS with this secret; it must belong to the public key in
      # upgrade.go. Secrets are not given to pull requests from forks: then only a notice.
      - name: Update signing key matches upgrade.go
        env:
          ZB_UPDATE_SIGNING_KEY: ${{ secrets.ZB_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$ZB_UPDATE_SIGNING_KEY" ]; then echo "::notice::ZB_UPDATE_SIGNING_KEY not available"; exit 0; fi
          out=$(go run tools/sign.go sign dist/SHA256SUMS)
          want=$(sed -n 's/^const updatePublicKey = "\(.*\)"$/\1/p' upgrade.go)
          case "$out" in *"(public key $want)"*) echo "signed with the key of updatePublicKey" ;;
            *) echo "::error::ZB_UPDATE_SIGNING_KEY does not belong to updatePublicKey in upgrade.go"; exit 1 ;; esac
