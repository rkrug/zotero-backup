name: Docs

# Builds the documentation site (MkDocs, docs/) on every push and pull request,
# and publishes it with mike to the gh-pages branch (served by GitHub Pages),
# one folder per version:
#   - a normal release tag vX.Y.Z deploys X.Y and moves "latest" (the default)
#     to it; patch releases overwrite X.Y;
#   - a push to main redeploys the latest release (docs-only fixes), but only
#     while no Go code changed since that release's tag: a release pull request
#     waits for its tag;
#   - a push to dev deploys "dev" (unreleased);
#   - pre-release tags and other branches are only built.
on:
  push:
    branches: ["**"]
    tags: ["v*", "!v*-*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material==9.6.14
      - run: mkdocs build --strict

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages # one deploy at a time: each pushes to gh-pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and gh-pages
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material==9.6.14 mike==2.1.3
      - name: Version
        run: |
          release=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' 2>/dev/null || true)
          case "$GITHUB_REF" in
            refs/tags/*)
              release=${GITHUB_REF#refs/tags/} ;;
            refs/heads/main)
              if [ -z "$release" ] || ! git diff --quiet "$release" HEAD -- '*.go' go.mod; then
                echo "main has changes not released yet: the tag deploys them"
                exit 0
              fi ;;
            refs/heads/dev)
              echo "DOCS_VERSION=dev (unreleased)" >> "$GITHUB_ENV"
              echo "MIKE_ARGS=dev" >> "$GITHUB_ENV"
              exit 0 ;;
          esac
          minor=${release#v}; minor=${minor%.*}
          echo "DOCS_VERSION=$release" >> "$GITHUB_ENV"
          echo "MIKE_ARGS=--update-aliases $minor latest" >> "$GITHUB_ENV"
      - name: Publish to gh-pages
        if: env.MIKE_ARGS != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || true
          mike deploy --push --alias-type copy $MIKE_ARGS
          case "$MIKE_ARGS" in *latest) mike set-default --push latest ;; esac
