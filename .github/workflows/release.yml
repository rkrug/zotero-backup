name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normal releases only from main
        run: |
          # pre-releases (v0.2.0-rc.1) are tagged on dev, normal releases (v0.2.0) on main
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
                 { echo "$GITHUB_REF_NAME is a normal release but not on main: tag it on main after the PR from dev, or use a pre-release tag (e.g. $GITHUB_REF_NAME-rc.1)"; exit 1; } ;;
          esac
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: .github/build.sh "$GITHUB_REF_NAME"
      - name: Create the release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac   # v0.1.0-rc.1 etc.
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes $pre
